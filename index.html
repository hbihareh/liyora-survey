document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 f.onChange }}\" placeholder=\"{{ f.ph }}\" style=\"font-size:16px;padding:13px 14px;border:1px solid #cfc5bb;background:#fff;color:#3f2c37;border-radius:0;outline:none\">\n          <\u002Flabel>\n        <\u002Fsc-for>\n        <sc-for list=\"{{ aboutChoices }}\" as=\"q\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <div style=\"display:flex;flex-direction:column;gap:2px\">\n              <div style=\"font-size:14px;font-weight:700\">{{ q.label }}<\u002Fdiv>\n              <div style=\"font-size:13px;color:#6f6269\">{{ q.hint }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n              <sc-for list=\"{{ q.options }}\" as=\"o\" hint-placeholder-count=\"5\">\n                <button sc-camel-on-click=\"{{ o.onClick }}\" style=\"font-family:Lato,sans-serif;font-size:14px;min-height:44px;padding:0 16px;border:1px solid #43283b;background:{{ o.bg }};color:{{ o.fg }};cursor:pointer;border-radius:999px\">{{ o.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isMatrix }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:22px\">\n        <div style=\"display:flex;flex-direction:column;gap:4px;border-bottom:1px solid #3f2c37;padding-bottom:14px\">\n          <div style=\"font-size:11px;letter-spacing:0.24em;font-weight:700;text-transform:uppercase;color:#8a7046\">{{ screen.step }}<\u002Fdiv>\n          <div style=\"font-size:30px;font-weight:300;line-height:1.1\">{{ screen.name }}<\u002Fdiv>\n          <div style=\"font-size:14px;font-weight:700\">{{ screen.sub }}<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ screen.hasStars }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <div sc-camel-on-change=\"{{ screen.onQuote }}\" rows=\"3\" placeholder=\"{{ screen.quotePh }}\" style=\"font-size:16px;padding:12px 14px;border:1px solid #cfc5bb;background:#fff;color:#3f2c37;border-radius:0;resize:vertical;outline:none\"><\u002Ftextarea>\n        <\u002Flabel>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isWords }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:22px\">\n        <div style=\"font-size:26px;font-weight:300;line-height:1.2\">In your words<\u002Fdiv>\n        <sc-for list=\"{{ wordChoices }}\" as=\"q\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <div style=\"font-size:14px;font-weight:700\">{{ q.label }}<\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n              <sc-for list=\"{{ q.options }}\" as=\"o\" hint-placeholder-count=\"4\">\n                <button sc-camel-on-click=\"{{ o.onClick }}\" style=\"font-family:Lato,sans-serif;font-size:14px;min-height:44px;padding:0 16px;border:1px solid #43283b;background:{{ o.bg }};color:{{ o.fg }};cursor:pointer;border-radius:999px\">{{ o.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <sc-for list=\"{{ wordFields }}\" as=\"f\" hint-placeholder-count=\"3\">\n          <label style=\"display:flex;flex-direction:column;gap:8px\">\n            <div style=\"display:flex;flex-direction:column;gap:2px\">\n              <div style=\"font-size:14px;font-weight:700\">{{ f.label }}<\u002Fdiv>\n              <div style=\"font-size:13px;color:#6f6269\">{{ f.hint }}<\u002Fdiv>\n            <\u002Fdiv>\n            <textarea value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.onChange }}\" rows=\"{{ f.rows }}\" placeholder=\"{{ f.ph }}\" style=\"font-size:16px;padding:12px 14px;border:1px solid #cfc5bb;background:#fff;color:#3f2c37;border-radius:0;resize:vertical;outline:none\"><\u002Ftextarea>\n          <\u002Flabel>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isPhotos }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:22px\">\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <div style=\"font-size:26px;font-weight:300;line-height:1.2\">Before and after<\u002Fdiv>\n          <div style=\"font-size:15px;line-height:1.55\">Same light, same angle, hair down. Natural daylight works best.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px\">\n          <sc-for list=\"{{ photos }}\" as=\"p\" hint-placeholder-count=\"2\">\n            <label style=\"display:flex;flex-direction:column;gap:8px;cursor:pointer\">\n              <div style=\"aspect-ratio:3/4;border:1px dashed #8a7046;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative\">\n                <sc-if value=\"{{ p.has }}\" hint-placeholder-val=\"{{ false }}\">\n                  <img src=\"{{ p.src }}\" alt=\"\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover\">\n                <\u002Fsc-if>\n                <div style=\"font-size:13px;color:#6f6269;text-align:center;padding:10px\">{{ p.cta }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:14px;font-weight:700;text-align:center\">{{ p.label }}<\u002Fdiv>\n              <input type=\"file\" accept=\"image/*\" sc-camel-on-change=\"{{ p.onChange }}\" style=\"display:none\">\n            <\u002Flabel>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <label style=\"display:flex;flex-direction:column;gap:8px;cursor:pointer;border:1px dashed #8a7046;background:#fff;padding:14px 16px\">\n          <div style=\"font-size:14px;font-weight:700\">Optional: a short video of your finished hair<\u002Fdiv>\n          <div style=\"font-size:13px;color:#6f6269\">{{ videoLabel }}<\u002Fdiv>\n          <input type=\"file\" accept=\"video/*\" sc-camel-on-change=\"{{ onVideo }}\" style=\"display:none\">\n        <\u002Flabel>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isConsent }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:22px\">\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <div style=\"font-size:26px;font-weight:300;line-height:1.2\">Sharing your results<\u002Fdiv>\n          <div style=\"font-size:15px;line-height:1.55\">We’d love to feature you at launch. Choose what you’re comfortable with.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <sc-for list=\"{{ consents }}\" as=\"c\" hint-placeholder-count=\"4\">\n            <button sc-camel-on-click=\"{{ c.onClick }}\" style=\"font-family:Lato,sans-serif;display:grid;grid-template-columns:24px minmax(0,1fr);gap:12px;align-items:start;text-align:left;background:none;border:0;padding:4px 0;cursor:pointer;color:#3f2c37\">\n              <div style=\"width:22px;height:22px;border:1px solid #43283b;background:{{ c.bg }};color:#f2efea;font-size:14px;line-height:22px;text-align:center\">{{ c.mark }}<\u002Fdiv>\n              <div style=\"font-size:14px;line-height:1.5\">{{ c.label }}<\u002Fdiv>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px;border-top:1px solid #ddd5cc;padding-top:18px\">\n          <div style=\"font-size:14px;font-weight:700\">How should we credit you?<\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n            <sc-for list=\"{{ credit }}\" as=\"o\" hint-placeholder-count=\"3\">\n              <button sc-camel-on-click=\"{{ o.onClick }}\" style=\"font-family:Lato,sans-serif;font-size:14px;min-height:44px;padding:0 16px;border:1px solid #43283b;background:{{ o.bg }};color:{{ o.fg }};cursor:pointer;border-radius:999px\">{{ o.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isDone }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;padding-top:40px\">\n        <img src=\"2515dbae-49ad-499a-85e1-9bbb6ad7f51c\" alt=\"\" style=\"width:80px;height:auto;display:block;background:#43283b;padding:18px;border-radius:999px\">\n        <div style=\"font-size:30px;font-weight:300;line-height:1.15\">Thank you.<\u002Fdiv>\n        <p style=\"margin:0;font-size:16px;line-height:1.6;max-width:360px\">Your feedback is in. We can’t wait to share the ritual with everyone on January 20th.<\u002Fp>\n        <div style=\"font-size:15px;font-style:italic;font-weight:300\">Made for your light.<\u002Fdiv>\n        <div style=\"font-size:14px;letter-spacing:0.08em\">@liyorahair<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ hasError }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"font-size:14px;line-height:1.5;color:#9b2c3a;border-left:2px solid #9b2c3a;padding:2px 0 2px 10px\">{{ error }}<\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ showNav }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"margin-top:auto;display:flex;gap:10px;padding-top:12px\">\n        <sc-if value=\"{{ canBack }}\" hint-placeholder-val=\"{{ false }}\">\n          <button sc-camel-on-click=\"{{ back }}\" style=\"font-family:Lato,sans-serif;flex:none;min-height:52px;padding:0 20px;border:1px solid #43283b;background:transparent;color:#43283b;font-size:13px;letter-spacing:0.18em;font-weight:700;text-transform:uppercase;cursor:pointer\">Back<\u002Fbutton>\n        <\u002Fsc-if>\n        <button sc-camel-on-click=\"{{ next }}\" style=\"font-family:Lato,sans-serif;flex:1;min-height:52px;border:0;background:#43283b;color:#f2efea;font-size:13px;letter-spacing:0.18em;font-weight:700;text-transform:uppercase;cursor:pointer\">{{ nextLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;endpoint&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Google Script web app URL (where answers are sent)&quot;}}\">\nconst PRODUCTS = [\n  { step: 'Step 01 · Cleanse', name: 'Renewal', sub: 'Hydrating Shampoo', claims: ['My hair felt clean, not dry.', 'My hair felt smoother and was easier to detangle.', 'My hair had less static.'] },\n  { step: 'Step 02 · Restore', name: 'Reclaim', sub: 'Hair Repair Mask', claims: ['My hair felt softer.', 'My hair felt smoother and more manageable.', 'It added shine without weighing my hair down.'] },\n  { step: 'Step 03 · Texture', name: 'Awaken', sub: 'Salt + Texture Mist', claims: ['It gave my hair effortless, beachy texture.', 'It added volume and movement.', 'My hair felt touchable, not stiff or crunchy.'] },\n  { step: 'Step 04 · Volumize', name: 'Abundance', sub: 'Volumizing Styling Cream', claims: ['My hair looked fuller.', 'It added visible lift and body.', 'My hair stayed touchable, not stiff.'] },\n  { step: 'Step 05 · Radiate', name: 'Radiance', sub: 'Finishing Oil & Thermal Protectant', claims: ['My hair had a glossy, glass-like shine.', 'My hair felt smoother and softer.', 'It felt weightless, not greasy.'] },\n  { step: 'Step 06 · Refresh', name: 'Reborn', sub: 'Dry Shampoo', claims: ['It refreshed my roots and absorbed oil.', 'It left no visible residue.', 'It helped me go longer between washes.'] }\n];\nconst OVERALL = { step: 'After four weeks', name: 'The full ritual', sub: 'All six products together', claims: ['My hair looks shinier.', 'My hair feels softer.', 'My hair looks fuller.', 'My hair looks more polished, like I just left the salon.', 'I love the scent.', 'The routine was easy to follow.'] };\nconst STEPS = ['intro', 'about', ...PRODUCTS.map((_, i) => 'p' + i), 'overall', 'words', 'photos', 'consent', 'done'];\n\nclass Component extends DCLogic {\n  state = { step: 0, a: {}, m: {}, q: {}, stars: {}, photos: {}, video: '', consent: {}, files: {}, sending: false, error: '' };\n\n  async toB64(file, isImage) {\n    if (isImage) {\n      try {\n        const bmp = await createImageBitmap(file);\n        const k = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));\n        const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);\n        c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);\n        return { name: file.name.replace(/\\.\\w+$/, '') + '.jpg', type: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.85).split(',')[1] };\n      } catch (e) {}\n    }\n    const data = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(file); });\n    return { name: file.name, type: file.type, data };\n  }\n\n  collect() {\n    const { a, m, q, stars, consent } = this.state;\n    const f = { 'Name': a.name || '', 'Email': a.email || '', 'Age range': a.age || '', 'Hair type': a.type || '', 'Hair traits': (a.traits || []).join(', '), 'Biggest concern': a.concern || '' };\n    PRODUCTS.forEach((p, i) => {\n      const k = 'p' + i;\n      f[`${p.name} ★`] = stars[k] || '';\n      p.claims.forEach((c, ci) => { f[`${p.name}: ${c}`] = m[k + ci] || ''; });\n      f[`${p.name}: what they loved`] = q[k] || '';\n    });\n    OVERALL.claims.forEach((c, ci) => { f[`Overall: ${c}`] = m['overall' + ci] || ''; });\n    Object.assign(f, {\n      'Hair after 4 weeks': q.overall || '', 'Favorite': a.fav || '', 'Why favorite': a.whyFav || '', 'Would repurchase': (a.buy || []).join(', '),\n      'Recommend': a.rec || '', 'Three words': a.three || '', 'Tell a friend': a.friend || '',\n      'OK to use photos/video': consent.photos ? 'Yes' : 'No', 'OK to quote': consent.quote ? 'Yes' : 'No', 'OK to contact': consent.contact ? 'Yes' : 'No',\n      'Credit as': a.credit || '', 'Confirmed free + honest': consent.honest ? 'Yes' : 'No'\n    });\n    return f;\n  }\n\n  async submit() {\n    const url = (this.props.endpoint || '').trim();\n    if (!this.state.consent.honest) { this.setState({ error: 'Please confirm the last checkbox to submit.' }); return; }\n    if (!url) { this.setState({ error: 'This survey isn’t connected yet. Add the Google Script link in Tweaks.' }); return; }\n    this.setState({ sending: true, error: '' });\n    try {\n      const fl = this.state.files, files = {};\n      if (fl.video && fl.video.size > 30 * 1024 * 1024) { this.setState({ sending: false, error: 'That video is over 30 MB. Please trim it or upload a shorter clip.' }); return; }\n      for (const k of ['before', 'after', 'video']) if (fl[k]) files[k] = await this.toB64(fl[k], k !== 'video');\n      const body = JSON.stringify({ fields: this.collect(), files });\n      try {\n        const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body });\n        if (!r.ok) throw new Error('bad');\n      } catch (e) {\n        await fetch(url, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body });\n      }\n      this.setState({ sending: false });\n      this.go(1);\n    } catch (e) {\n      this.setState({ sending: false, error: 'Something went wrong sending your answers. Please check your connection and try again.' });\n    }\n  }\n\n  handleNext() {\n    const key = STEPS[this.state.step], a = this.state.a;\n    if (key === 'about' && (!a.name || !/\\S+@\\S+\\.\\S+/.test(a.email || ''))) { this.setState({ error: 'Please add your name and a valid email.' }); return; }\n    if (key === 'consent') { this.submit(); return; }\n    this.setState({ error: '' });\n    this.go(1);\n  }\n\n  setA(k, v) { this.setState(s => ({ a: { ...s.a, [k]: v } })); }\n  chip(label, on, onClick) { return { label, onClick, bg: on ? '#43283b' : 'transparent', fg: on ? '#f2efea' : '#43283b' }; }\n  single(key, opts) { return opts.map(o => this.chip(o, this.state.a[key] === o, () => this.setA(key, o))); }\n  multi(key, opts) {\n    const cur = this.state.a[key] || [];\n    return opts.map(o => this.chip(o, cur.includes(o), () => this.setA(key, cur.includes(o) ? cur.filter(x => x !== o) : [...cur, o])));\n  }\n  go(d) { this.setState(s => ({ step: Math.max(0, Math.min(STEPS.length - 1, s.step + d)) })); if (window.scrollTo) window.scrollTo(0, 0); }\n\n  buildScreen(key, d, isProduct) {\n    const { m, q, stars } = this.state;\n    return {\n      ...d,\n      hasStars: isProduct,\n      starsLabel: `Rate ${d.name}`,\n      stars: [1, 2, 3, 4, 5].map(n => ({ n: String(n), fg: (stars[key] || 0) >= n ? '#8a7046' : '#d9d1ca', onClick: () => this.setState(s => ({ stars: { ...s.stars, [key]: n } })) })),\n      claims: d.claims.map((text, ci) => {\n        const id = key + ci, v = m[id] || 0;\n        return { text, scale: [1, 2, 3, 4, 5].map(n => ({ n: String(n), bg: v === n ? '#43283b' : '#fff', fg: v === n ? '#f2efea' : '#43283b', onClick: () => this.setState(s => ({ m: { ...s.m, [id]: n } })) })) };\n      }),\n      quoteLabel: isProduct ? `In a sentence, what did you love about ${d.name}?` : 'Describe your hair after four weeks.',\n      quotePh: isProduct ? 'This becomes a review on the product page.' : 'What changed? What do people notice?',\n      quote: q[key] || '',\n      onQuote: e => { const v = e.target.value; this.setState(s => ({ q: { ...s.q, [key]: v } })); }\n    };\n  }\n\n  renderVals() {\n    const { step, a, photos, video, consent } = this.state;\n    const key = STEPS[step];\n    const pi = /^p\\d$/.test(key) ? Number(key.slice(1)) : -1;\n    const total = STEPS.length - 2;\n    const names = PRODUCTS.map(x => x.name);\n    const screen = pi >= 0 ? this.buildScreen(key, PRODUCTS[pi], true) : key === 'overall' ? this.buildScreen(key, OVERALL, false) : null;\n    const txt = (k, label, hint, ph, rows) => ({ label, hint, ph, rows: String(rows), value: a[k] || '', onChange: e => this.setA(k, e.target.value) });\n    return {\n      isIntro: key === 'intro', isAbout: key === 'about', isMatrix: !!screen, isWords: key === 'words', isPhotos: key === 'photos', isConsent: key === 'consent', isDone: key === 'done',\n      showProgress: step > 0 && key !== 'done',\n      progressLabel: `Step ${step} of ${total}`,\n      progressPct: `${Math.round((step / total) * 100)}%`,\n      showNav: key !== 'done', canBack: step > 0,\n      nextLabel: this.state.sending ? 'Sending…' : key === 'intro' ? 'Start' : key === 'consent' ? 'Submit' : 'Next',\n      next: () => { if (!this.state.sending) this.handleNext(); }, back: () => { this.setState({ error: '' }); this.go(-1); },\n      hasError: !!this.state.error, error: this.state.error,\n      introList: [\n        { n: '01', t: 'A little about you and your hair' },\n        { n: '02', t: 'Each of the six products' },\n        { n: '03', t: 'Your results, in your own words' },\n        { n: '04', t: 'Your before and after photos' }\n      ],\n      textFields: [\n        { label: 'Name', ph: 'First and last', value: a.name || '', onChange: e => this.setA('name', e.target.value) },\n        { label: 'Email', ph: 'you@email.com', value: a.email || '', onChange: e => this.setA('email', e.target.value) }\n      ],\n      aboutChoices: [\n        { label: 'Age range', hint: 'Pick one.', options: this.single('age', ['18–24', '25–34', '35–44', '45–54', '55+']) },\n        { label: 'Your hair type', hint: 'Pick one.', options: this.single('type', ['Straight', 'Wavy', 'Curly', 'Coily']) },\n        { label: 'Your hair is…', hint: 'Pick any that apply.', options: this.multi('traits', ['Fine', 'Thick', 'Dry', 'Damaged', 'Color-treated', 'Oily scalp', 'Heat-styled often']) },\n        { label: 'Biggest concern going in', hint: 'Pick one.', options: this.single('concern', ['Dryness', 'Frizz', 'Lack of volume', 'Dullness', 'Damage', 'Oiliness']) }\n      ],\n      screen,\n      wordChoices: [\n        { label: 'Your favorite product', options: this.single('fav', names) },\n        { label: 'Which would you repurchase?', options: this.multi('buy', [...names, 'The full set']) },\n        { label: 'Would you recommend LIYORÁ to a friend?', options: this.single('rec', ['Definitely', 'Probably', 'Not sure', 'No']) }\n      ],\n      wordFields: [\n        txt('whyFav', 'Why was that your favorite?', 'Tell us like you’d tell a friend.', '', 3),\n        txt('three', 'Describe your hair now in three words.', 'For example: soft, glossy, full.', '', 1),\n        txt('friend', 'What would you tell a friend about LIYORÁ?', 'One or two sentences. We may quote you at launch.', '', 3)\n      ],\n      photos: ['before', 'after'].map(k => ({\n        label: k === 'before' ? 'Before' : 'After', has: !!photos[k], src: photos[k] || '', cta: photos[k] ? '' : 'Tap to upload',\n        onChange: e => { const f = e.target.files && e.target.files[0]; if (f) this.setState(s => ({ photos: { ...s.photos, [k]: URL.createObjectURL(f) }, files: { ...s.files, [k]: f } })); }\n      })),\n      videoLabel: video || 'Tap to upload. A hair flip or slow turn in natural light, 15–30 seconds.',\n      onVideo: e => { const f = e.target.files && e.target.files[0]; if (f) this.setState(s => ({ video: f.name, files: { ...s.files, video: f } })); },\n      consents: [\n        { k: 'photos', label: 'LIYORÁ may use my photos and video on social media, the website, and in ads.' },\n        { k: 'quote', label: 'LIYORÁ may quote my answers in reviews and marketing.' },\n        { k: 'contact', label: 'LIYORÁ may contact me about being featured at launch.' },\n        { k: 'honest', label: 'I received these products free to test, and my answers reflect my honest experience.' }\n      ].map(c => ({ ...c, bg: consent[c.k] ? '#43283b' : '#fff', mark: consent[c.k] ? '✓' : '', onClick: () => this.setState(s => ({ consent: { ...s.consent, [c.k]: !s.consent[c.k] } })) })),\n      credit: this.single('credit', ['First name + last initial', 'First name only', 'Anonymous'])\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
